    <style rel="stylesheet" crossorigin>:root {
  color-scheme: dark;
  --bg: #0b141c;
  --panel: #111e28;
  --panel-2: #0e1a23;
  --border: #263c4d;
  --border-soft: #1d2e3b;
  --text: #dce8ef;
  --muted: #93a6b4;
  --accent: #64dccc;
  --accent-ink: #06231f;
  --danger: #ff9d9d;
  --danger-bg: #2c1a20;
  --control-h: 38px;
  --radius: 8px;
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}

* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 1160px; margin: 0 auto; padding: 32px 22px 140px; }

h1 { font-size: 30px; margin: 6px 0 10px; letter-spacing: -0.01em; }
h2 { font-size: 19px; margin: 0; }
h4 { font-size: 14px; margin: 0; color: var(--text); }
p { margin: 8px 0; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.92em; }
.eyebrow { color: var(--accent); font-size: 12px; letter-spacing: 0.2em; margin: 0; }
.lede { font-size: 16px; color: var(--text); max-width: 70ch; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.app-header { margin-bottom: 22px; }

/* Panels & steps ---------------------------------------------------------- */
.panel {
  margin: 18px 0;
  padding: 22px 24px;
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  background: var(--panel);
}
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.step { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.step-no {
  display: grid; place-items: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 14px;
}
.sub-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 18px 0 4px; }
.groups-head { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border-soft); }
.block-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }

/* Controls: one shared height keeps every row even ------------------------ */
input[type="text"], select {
  width: 100%; height: var(--control-h);
  padding: 0 11px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text);
  font: inherit; font-size: 14px;
}
select { padding-right: 28px; }
textarea {
  width: 100%; padding: 10px 11px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--bg); color: var(--text);
  font-family: ui-monospace, Menlo, monospace; font-size: 13px; resize: vertical;
}
input:focus, select:focus, textarea:focus, button:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
input[aria-invalid="true"] { border-color: var(--danger); }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 12px; color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }

/* Info tooltip: pure-CSS reveal on hover/focus. */
.infotip { position: relative; display: inline-flex; cursor: help; }
.infotip-icon { display: grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border); color: var(--muted); font-size: 9px; font-style: italic; font-weight: 700; line-height: 1; }
.infotip:hover .infotip-icon, .infotip:focus .infotip-icon { border-color: var(--accent); color: var(--accent); }
/* display:none (not visibility:hidden) so the hidden bubble never adds page width. */
.infotip-bubble { display: none; position: absolute; bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%); width: max-content; max-width: 240px; padding: 8px 10px; border-radius: 6px; background: #0a1720; border: 1px solid var(--border); color: var(--text); font-size: 12px; font-weight: 400; line-height: 1.4; text-transform: none; letter-spacing: 0; white-space: normal; z-index: 20; pointer-events: none; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); }
.infotip:hover .infotip-bubble, .infotip:focus .infotip-bubble, .infotip:focus-within .infotip-bubble { display: block; }
.infotip-bubble::after { content: ""; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top-color: var(--border); }
.field-hint { color: #6d8393; font-weight: 400; }
.field-error { font-size: 12px; color: var(--danger); }
.field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px 16px; }
.setup-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); margin-bottom: 18px; }
.timings-grid { margin-top: 18px; }

/* Config groups (view-aware) ---------------------------------------------- */
.config-groups { display: flex; flex-direction: column; gap: 14px; margin-top: 4px; }
.config-group { border: 1px solid var(--border-soft); border-radius: 8px; margin: 0; padding: 12px 14px 14px; background: var(--panel-2); }
.config-group > legend { padding: 0 6px; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }

/* Buttons ----------------------------------------------------------------- */
button { font: inherit; cursor: pointer; }
.btn-primary, .btn-soft, .btn-remove, .btn-copy {
  border-radius: 6px; border: 1px solid var(--border);
  background: #182b38; color: var(--text);
  font-size: 13px; padding: 0 14px; height: var(--control-h);
}
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-soft:hover, .btn-remove:hover, .btn-copy:hover { background-color: #213847; }
.btn-primary:not(:disabled):hover { background: #7ee9da; }
.btn-remove { color: var(--muted); }
.btn-remove:hover { color: var(--danger); border-color: #4a2b33; }
.btn-soft:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-copy { height: 30px; padding: 0 10px; }

/* Cards ------------------------------------------------------------------- */
.card { margin: 14px 0; padding: 16px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--panel-2); }
.card-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-name { flex: 1 1 200px; font-weight: 600; }
.base-block { margin: 6px 0 14px; }

/* Segmented view control -------------------------------------------------- */
.view-control { display: inline-flex; align-items: center; gap: 8px; }
.segmented { display: inline-flex; height: var(--control-h); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg { height: 100%; border: 0; border-left: 1px solid var(--border); background: var(--bg); color: var(--muted); padding: 0 14px; font-size: 13px; text-transform: capitalize; }
.seg:first-child { border-left: 0; }
.seg:hover { color: var(--text); }
.seg-on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

/* Chips ------------------------------------------------------------------- */
.selections { display: flex; flex-wrap: wrap; gap: 24px; }
.chip-group { border: 0; margin: 0; padding: 0; min-width: 0; }
.chip-group[disabled] { opacity: 0.45; }
.chip-group > legend { font-size: 12px; color: var(--muted); margin-bottom: 8px; padding: 0; display: inline-flex; align-items: center; gap: 5px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 999px; font-size: 13px; color: var(--muted); user-select: none; }
.chip input { accent-color: var(--accent); margin: 0; }
.chip-on { border-color: var(--accent); color: var(--text); background: #0f2a2c; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot-ok { background: #4bd07f; }
.dot-missing { background: #e6a34a; }
.chip-missing { border-style: dashed; }

/* Missing-component install hint. */
.install-hint { margin-top: 14px; border: 1px solid #6b5426; border-radius: 8px; background: rgba(230, 163, 74, 0.08); padding: 12px 14px; }
.install-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.install-title { color: #e6b877; font-weight: 600; font-size: 13px; }

/* Matrix axes ------------------------------------------------------------- */
.axes { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border-soft); }
.axes-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.axis-row { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(180px, 2fr) auto; gap: 12px; align-items: end; margin: 10px 0; }

/* Preset gallery ---------------------------------------------------------- */
.preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 10px; }
.preset { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 14px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--panel-2); color: var(--text); min-height: 110px; }
.preset:hover:not(:disabled) { border-color: var(--border); background: #12222e; }
.preset:disabled { opacity: 0.5; cursor: not-allowed; }
.preset-on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.preset-blank { border-style: dashed; }
.preset-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.preset-desc { font-size: 13px; color: var(--muted); flex: 1; }
.preset-scope { font-size: 12px; color: var(--accent); font-family: ui-monospace, Menlo, monospace; }
.badge { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: #24384a; color: var(--muted); }
.badge-custom { background: var(--accent); color: var(--accent-ink); }

/* Saved custom suites: a distinct collapsible box above the bundled gallery. */
.custom-box { border: 1px solid var(--accent); border-radius: 12px; background: rgba(100, 220, 204, 0.06); margin-bottom: 16px; padding: 2px 16px 16px; }
.custom-box > summary { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 12px 0; color: var(--text); font-weight: 600; list-style: none; }
.custom-box > summary::-webkit-details-marker { display: none; }
.custom-box > summary::before { content: "▸"; color: var(--accent); font-size: 12px; transition: transform 0.15s; }
.custom-box[open] > summary::before { transform: rotate(90deg); }
.custom-summary { font-size: 15px; }
.custom-count { margin-left: auto; font-size: 12px; color: var(--muted); background: #16262f; border-radius: 999px; padding: 2px 9px; }
.preset-custom { border-color: rgba(100, 220, 204, 0.4); background: rgba(100, 220, 204, 0.05); }
.preset-custom:hover:not(:disabled) { border-color: var(--accent); background: rgba(100, 220, 204, 0.1); }

/* Preview ----------------------------------------------------------------- */
.summary { font-size: 17px; }
.summary strong { color: var(--accent); }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; }
.pill-pending { background: #24384a; color: var(--muted); }
.alert { color: var(--danger); white-space: pre-wrap; border-left: 3px solid var(--danger); padding: 10px 14px; background: var(--danger-bg); border-radius: 0 6px 6px 0; }
.table-wrap { overflow: auto; max-height: 440px; border: 1px solid var(--border-soft); border-radius: 8px; margin: 12px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
th { position: sticky; top: 0; background-color: #16262f; color: var(--muted); font-weight: 600; }
tbody tr:hover { background: #12222e; }

/* Live run command inside the preview ------------------------------------- */
.run-here { margin: 14px 0; }
.run-here .command-row { margin-top: 8px; }
.run-note { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 0; }

/* Launcher ---------------------------------------------------------------- */
.launcher { border-color: var(--accent); }
.commands { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.command-row { border: 1px solid var(--border-soft); border-radius: 8px; padding: 12px 14px; background: var(--panel-2); }
.command-meta { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.command-label { font-weight: 600; font-size: 13px; color: var(--accent); }
.command-line { display: flex; align-items: center; gap: 10px; }
.command-line code { flex: 1; min-width: 0; overflow-x: auto; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border-soft); border-radius: 6px; white-space: pre; }

/* Advanced ---------------------------------------------------------------- */
.raw { margin: 18px 0; padding: 16px 20px; border: 1px solid var(--border-soft); border-radius: 12px; background: var(--panel); }
.raw > summary { cursor: pointer; color: var(--text); font-weight: 500; }
.raw textarea { margin: 10px 0; }

/* Source controls page ---------------------------------------------------- */
.controls-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 6px; }
.backend-badge { border: 1px solid var(--border); border-radius: 6px; color: var(--accent); padding: 7px 11px; font-size: 12px; white-space: nowrap; }
.preset-row { margin: 4px 0 16px; }
.workload-view { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 4px; }
.controls-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
.inline-alert { border-left: none; background: none; padding: 0; }
.status-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.stat { border: 1px solid var(--border-soft); border-radius: 8px; padding: 12px 14px; background: var(--panel-2); display: flex; flex-direction: column; gap: 4px; }
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.stat-value { font-size: 18px; font-variant-numeric: tabular-nums; }
.output-path { overflow-wrap: anywhere; margin-top: 10px; }
.controls-footer { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); font-size: 12px; margin-top: 20px; flex-wrap: wrap; }

/* Action bar -------------------------------------------------------------- */
.action-bar {
  position: sticky; bottom: 0; z-index: 5;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap;
  margin: 18px -22px -140px; padding: 16px 22px;
  background: rgba(9, 16, 22, 0.9); backdrop-filter: blur(8px);
  border-top: 1px solid var(--border);
}
.save-controls { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.save-name { min-width: 0; }
.save-name-row { display: flex; align-items: center; height: var(--control-h); border: 1px solid var(--border); border-radius: 6px; background: var(--bg); overflow: hidden; }
.save-name-row .prefix, .save-name-row .suffix { padding: 0 8px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; color: var(--muted); background: #16262f; height: 100%; display: flex; align-items: center; }
.save-name-row input { height: 100%; border: 0; border-radius: 0; background: transparent; min-width: 120px; }
.action-right { display: flex; align-items: center; gap: 10px; }
.file-btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.action-alert { margin: 0 -22px; border-radius: 0; }

@media (max-width: 720px) {
  main { padding: 24px 14px 160px; }
  .panel { padding: 18px 16px; }
  .axis-row { grid-template-columns: 1fr 1fr; }
  .axis-row .btn-remove { grid-column: 1 / -1; justify-self: start; }
  /* Match the sticky bar's full-bleed margins to the narrower mobile padding. */
  .action-bar { flex-direction: column; align-items: stretch; margin-left: -14px; margin-right: -14px; }
  .action-alert { margin-left: -14px; margin-right: -14px; }
}</style>
