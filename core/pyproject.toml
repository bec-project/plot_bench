[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plotbench-core"
version = "0.1.0"
license = "BSD-3-Clause"
description = "Deterministic streaming source and measurement harness for plotting benchmarks"
requires-python = ">=3.13,<3.14"
dependencies = ["aiohttp>=3.12,<4", "numpy>=2.2,<3", "websockets>=15,<17", "psutil>=7,<8"]

[project.optional-dependencies]
browser = ["playwright>=1.55,<2"]

[project.scripts]
plotbench = "plotbench.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "black>=26,<27", "isort>=6,<9", "playwright>=1.55,<2"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
skip-magic-trailing-comma = true

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/plotbench"]
