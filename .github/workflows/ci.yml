name: Functional validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-components:
    name: Components (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Linux libraries for functional tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake ninja-build \
            libwayland-dev libxkbcommon-dev libegl1 libgl1 libvulkan1 \
            mesa-vulkan-drivers libfontconfig1 libfreetype6 libdbus-1-3
      - name: Install selected components and test tools
        run: ./scripts/setup core pyqtgraph matplotlib qtgraphs plotly rust iced --dev
      - name: Browser system libraries
        if: runner.os == 'Linux'
        run: .envs/plotting-benchmark/bin/python -m playwright install-deps chromium
      - name: Core and source conformance
        run: .envs/plotting-benchmark/bin/python -m pytest core/tests
      - name: Browser controller tests with Playwright's bundled Node
        run: |
          .envs/plotting-benchmark/bin/python - <<'PY'
          import subprocess
          from pathlib import Path
          import playwright

          node = Path(playwright.__file__).parent / "driver" / "node"
          subprocess.run([str(node), "--test", "core/tests/browser_driver.test.cjs"], check=True)
          PY
      - name: Web UI type checking and committed bundle verification
        run: |
          export PATH="$PWD/.envs/node/node_modules/node/bin:$PATH"
          npm ci --prefix core/webui --cache "$PWD/.cache/npm" --no-audit --no-fund
          npm --prefix core/webui test
          npm --prefix core/webui run typecheck
          npm --prefix core/webui run build
          git diff --exit-code -- core/src/plotbench/matrix_assets core/src/plotbench/controls.html
      - name: Matrix editor and source controls browser interactions
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
        run: |
          PLOTBENCH_TEST_BROWSER="$(.envs/plotting-benchmark/bin/python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          export PLOTBENCH_TEST_BROWSER
          .envs/plotting-benchmark/bin/python -m pytest core/tests/test_matrix_browser.py core/tests/test_source_controls.py
      - name: Python quality checks
        run: |
          .envs/plotting-benchmark/bin/python -m ruff check core
          .envs/plotting-benchmark/bin/python -m black core --check
      - name: Qt adapter tests (offscreen, not performance)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .envs/plotting-benchmark-pyqtgraph/bin/python -m pytest frontends/pyqtgraph/tests
          .envs/plotting-benchmark-matplotlib/bin/python -m pytest frontends/matplotlib/tests
          .envs/plotting-benchmark-qtgraphs/bin/python -m pytest frontends/qtgraphs/tests
      - name: TypeScript tests and production build
        run: |
          export PATH="$PWD/.envs/node/node_modules/node/bin:$PATH"
          npm --prefix frontends/plotly test
          npm --prefix frontends/plotly run build
          .envs/plotting-benchmark/bin/python -m plotbench.provenance plotly
      - name: Rust tests and formatting
        run: |
          cargo fmt --manifest-path backends/rust/Cargo.toml --all --check
          cargo fmt --manifest-path frontends/iced/Cargo.toml --all --check
          cargo test --manifest-path backends/rust/Cargo.toml --locked --release
          cargo test --manifest-path frontends/iced/Cargo.toml --locked --release
          cargo clippy --manifest-path backends/rust/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path frontends/iced/Cargo.toml --locked --all-targets -- -D warnings
      - name: Browser lifecycle smoke (headless, not performance)
        run: |
          cargo build --manifest-path backends/rust/Cargo.toml --locked --release
          .envs/plotting-benchmark/bin/python -m plotbench.provenance rust
          ./scripts/plotbench run --suite scenarios/smoke.json --frontends plotly \
            --backends python rust --modes stream replay --limit 1 \
            --warmup 0.5 --duration 2 --repetitions 1 --cooldown 0 --headless

  cpp:
    name: Qt C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Linux C++ and Qt development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libgl1-mesa-dev \
            libegl1-mesa-dev libwayland-dev libxkbcommon-dev libfontconfig1-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          modules: 'qtgraphs qtquick3d qtshadertools qtwebsockets'
          cache: true
      - name: Build with the selected SDK
        run: PLOTBENCH_QT_PREFIX="$QT_ROOT_DIR" ./scripts/setup qtgraphs-cpp --dev
      - name: Protocol and resource tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir frontends/qtgraphs-cpp/build --output-on-failure

  enterprise-linux:
    name: AlmaLinux ${{ matrix.version }} compatibility
    runs-on: ubuntu-24.04
    container: almalinux:${{ matrix.version }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        version: ['9', '10']
    steps:
      - name: Bootstrap build and runtime packages
        run: |
          # Accept curl-minimal from the base image as well as the full curl package.
          dnf --enablerepo=crb install -y git /usr/bin/curl gcc gcc-c++ make pkgconf-pkg-config cmake ninja-build \
            wayland-devel libxkbcommon-devel mesa-libEGL mesa-libGL vulkan-loader \
            mesa-vulkan-drivers fontconfig freetype dbus-libs nodejs npm
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Rust through rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Build selected components (no bundled browser)
        run: ./scripts/setup core pyqtgraph matplotlib qtgraphs plotly rust iced --dev --browser system
      - name: Core and source conformance
        run: .envs/plotting-benchmark/bin/python -m pytest core/tests
      - name: Qt conversion/adapter tests (offscreen, not performance)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .envs/plotting-benchmark-pyqtgraph/bin/python -m pytest frontends/pyqtgraph/tests
          .envs/plotting-benchmark-matplotlib/bin/python -m pytest frontends/matplotlib/tests
          .envs/plotting-benchmark-qtgraphs/bin/python -m pytest frontends/qtgraphs/tests
      - name: Rust and TypeScript tests
        run: |
          cargo test --manifest-path backends/rust/Cargo.toml --locked --release
          cargo test --manifest-path frontends/iced/Cargo.toml --locked --release
          export PATH="$PWD/.envs/node/node_modules/node/bin:$PATH"
          npm --prefix frontends/plotly test
      - name: Explain qualification boundary
        run: echo 'Container checks do not qualify native Wayland, an installed browser, or GPU performance.'

  fyne:
    name: Fyne Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      GOPATH: ${{ github.workspace }}/.cache/go
      GOCACHE: ${{ github.workspace }}/.cache/go-build
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: frontends/fyne/go.mod
          cache: false
      - name: Native Wayland and OpenGL build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgl1-mesa-dev \
            libegl1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Build native and WebAssembly frontends with provenance
        run: ./scripts/setup fyne fyne-wasm
      - name: Browser system libraries
        if: runner.os == 'Linux'
        run: .envs/plotting-benchmark/bin/python -m playwright install-deps chromium
      - name: Scalar reference protocol, transport, raster and telemetry tests
        run: |
          go -C frontends/fyne test -race -tags ci ./...
          go -C frontends/fyne vet -tags ci ./...
          test -z "$(gofmt -l frontends/fyne/*.go)"
          go -C frontends/fyne mod verify
          git diff --exit-code -- frontends/fyne/go.mod frontends/fyne/go.sum
      - name: WebAssembly protocol and browser WebSocket callback tests
        run: |
          GOOS=js GOARCH=wasm go -C frontends/fyne test -mod=readonly \
            -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" \
            source.go protocol.go render.go render_float32.go render_scalar.go \
            stream_wasm.go protocol_test.go render_test.go render_conversion_test.go \
            render_benchmark_test.go stream_wasm_test.go
      - name: Default SIMD conversion and x86 fallback checks
        env:
          GOEXPERIMENT: simd
        run: |
          go -C frontends/fyne test -race -tags ci ./...
          go -C frontends/fyne vet -tags ci ./...
          if [ "$(go env GOARCH)" = amd64 ]; then
            GODEBUG=cpu.avx512f=off go -C frontends/fyne test -tags ci ./...
            GODEBUG=cpu.avx=off go -C frontends/fyne test -tags ci ./...
          fi
          GOOS=js GOARCH=wasm go -C frontends/fyne test -mod=readonly \
            -exec "$(go env GOROOT)/lib/wasm/go_js_wasm_exec" \
            source.go protocol.go render.go render_float32.go render_simd.go \
            stream_wasm.go protocol_test.go render_test.go render_conversion_test.go \
            render_benchmark_test.go stream_wasm_test.go
      - name: Browser controller tests with Playwright's bundled Node
        run: |
          .envs/plotting-benchmark/bin/python - <<'PY'
          import subprocess
          from pathlib import Path
          import playwright

          node = Path(playwright.__file__).parent / "driver" / "node"
          subprocess.run([str(node), "--test", "core/tests/browser_driver.test.cjs"], check=True)
          PY
      - name: Fyne WebAssembly lifecycle smoke (headless, not performance)
        run: |
          ./scripts/plotbench run --suite scenarios/smoke.json --frontends fyne-wasm \
            --backends python --modes stream replay --limit 1 \
            --warmup 0.5 --duration 2 --repetitions 1 --cooldown 0 --headless

  jfreechart:
    name: JFreeChart Java (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        java: ['17', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build locked Java adapter
        run: ./scripts/setup jfreechart --dev
      - name: Protocol, transport, raster and telemetry tests (headless, not performance)
        run: |
          .envs/plotting-benchmark/bin/python frontends/jfreechart/build.py --test
          .envs/plotting-benchmark/bin/python -m plotbench.provenance jfreechart
          git diff --exit-code -- frontends/jfreechart/dependencies.lock.json
