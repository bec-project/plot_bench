[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "plotbench-matplotlib"
version = "0.1.0"
license = "BSD-3-Clause"
description = "Independent Matplotlib QtAgg adapter for the Plotbench shared source"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "plotbench-core",
  "PySide6>=6.11,<6.12",
  "qtpy>=2.4,<3",
  "matplotlib>=3.10,<4",
  "psutil>=7,<8",
]

[project.scripts]
plotbench-matplotlib = "plotbench_matplotlib.app:main"

[tool.uv.sources]
plotbench-core = { path = "../../core", editable = true }

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11"]

[tool.ruff]
line-length = 100
target-version = "py313"
